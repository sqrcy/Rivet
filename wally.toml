[package]
name = "sqrcy/rivet"
description = "Rivet is an all-in-one Roblox/Luau framework package for ordinary Unit modules, surfaces, contracts, codecs, and plugins."
version = "1.0.1"
license = "BSD-3-Clause"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
authors = ["@sqrcy"]
exclude = [
	"testPackage",
	"TestPackages",
	"tests",
	"docs",
	"examples",
	"benchmarks",
	"releases",
	"scripts",
	"tmp",
	"Packages",
	"DevPackages",
	"dev-types",
	".env.example",
	"benchmark-engine.project.json",
	"benchmark.project.json",
	"release.project.json",
	"test.project.json",
	"testez.yml",
	"stylua.toml",
	"selene.toml",
	"aftman.toml",
	"wally.lock",
	"sourcemap.json",
]

[dependencies]

[dev-dependencies]
TestEZ = "roblox/testez@0.4.1"
